name: Notion Update

on:
  push:
    branches:
      - main

jobs:
  update-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # needed to get the previous commit for a valid git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run AI Reporter Script
        run: node scripts/update-notion.mjs
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
